version: "3.9"

services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-org/my_slack_news}/backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-org/my_slack_news}/frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
